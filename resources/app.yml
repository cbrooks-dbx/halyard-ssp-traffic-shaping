resources:
  apps:
    halyard_app:
      name: ${var.app_name}
      description: Halyard Exchange traffic shaping console - throttle rules served from Lakebase, Genie Q&A, GenAI partner briefs
      source_code_path: ../app
      config:
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
          - name: CATALOG
            value: ${var.catalog}
          - name: SCHEMA
            value: ${var.schema}
          - name: LLM_ENDPOINT
            value: ${var.llm_endpoint}
          - name: WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: LAKEBASE_ENDPOINT
            value: projects/${var.lakebase_project}/branches/production/endpoints/primary
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: lakebase
          postgres:
            branch: projects/${resources.postgres_projects.halyard_lakebase.project_id}/branches/production
            database: projects/${resources.postgres_projects.halyard_lakebase.project_id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: llm
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
