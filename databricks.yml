# Halyard Exchange - SSP traffic shaping
# One bundle deploys every layer of the journey: Lakeflow pipeline, the
# orchestration job (ingest -> govern -> ML -> GenAI -> Lakebase -> Genie),
# the Lakebase instance, and the Databricks App.
bundle:
  name: ssp-traffic-shaping

variables:
  catalog:
    default: cmegdemos_catalog
  schema:
    default: ssp_traffic_shaping
  warehouse_id:
    description: Serverless SQL warehouse used by Genie, the app, and SQL tasks
    default: 9cd919d96b11bf1c
  llm_endpoint:
    description: Foundation Model API endpoint for the DSP partner briefs and rule explanations
    default: databricks-claude-sonnet-5-5
  batch_llm_endpoint:
    description: Endpoint for ai_query batch inference (not every FM endpoint supports batch; sonnet-5-5 does not yet)
    default: databricks-claude-sonnet-4-6
  lakebase_project:
    default: halyard-traffic-shaping
  app_name:
    default: halyard-traffic-shaping

include:
  - resources/*.yml

targets:
  dev:
    default: true
    workspace:
      host: https://fevm-cmegdemos.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
